<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Forms fixture</title>
  <style>
    body { margin: 0; font: 14px Arial, sans-serif; background: #f5f5f5; }
    #panel {
      box-sizing: border-box;
      width: 360px;
      padding: 24px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #333; }
    input[type="email"], input[type="password"], input[type="text"], textarea, select {
      width: 100%; height: 32px; box-sizing: border-box; border: 1px solid #ccc; padding: 4px 8px;
    }
    textarea { height: 64px; }
    .row { display: flex; align-items: center; gap: 8px; }
    input[type="submit"], button {
      height: 36px; border: 0; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <form id="panel">
    <label>Email
      <input id="email" type="email" name="email" placeholder="you@example.com" value="" />
    </label>
    <label>Password
      <input id="password" type="password" name="password" placeholder="Password" value="secret" />
    </label>
    <label>Notes
      <textarea id="notes" name="notes" placeholder="Say hello">Hello</textarea>
    </label>
    <div class="row">
      <input id="remember" type="checkbox" name="remember" checked />
      <span>Remember me</span>
    </div>
    <div class="row">
      <input id="plan-a" type="radio" name="plan" value="basic" checked />
      <span>Basic</span>
      <input id="plan-b" type="radio" name="plan" value="pro" />
      <span>Pro</span>
    </div>
    <label>Country
      <select id="country" name="country">
        <option value="us">United States</option>
        <option value="ca" selected>Canada</option>
      </select>
    </label>
    <input id="submit" type="submit" value="Sign In" />
    <button id="cancel" type="button">Cancel</button>
  </form>
</body>
</html>
