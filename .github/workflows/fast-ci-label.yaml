name: Fast CI label

# Adding or removing the `fast-ci` label re-runs the PR's Test Runtimes run so its Changes job picks up
# the new scope (#6282). This is a separate workflow on purpose: a labeled/unlabeled trigger on
# build-and-test.yaml itself would create a new run on the same commit for EVERY label, and that newest
# run (with no Build-and-Test (windows-latest) / (macos-15) reports) makes the required checks "expected"
# again, blocking merge. Here those events only start this workflow, which is not a required check.
on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  actions: write
  contents: read

jobs:
  Rerun:
    if: github.event.label.name == 'fast-ci'
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the PR's run on its head commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id="$(gh run list --workflow build-and-test.yaml --event pull_request --commit "$SHA" --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$id" ]; then echo "No run on $SHA yet; its Changes job will read the label itself."; exit 0; fi
          status="$(gh run view "$id" --json status --jq .status)"
          if [ "$status" != completed ]; then
            # A run opened together with the label (gh pr create --label) has not reached its Scope step
            # yet, and that step reads the label live, so there is nothing to redo.
            reached="$(gh run view "$id" --json jobs --jq '[.jobs[] | select(.name == "Changes") | .steps[] | select((.name | startswith("Scope")) and .status != "pending" and .status != "queued")] | length')"
            if [ "$reached" = 0 ]; then
              echo "Run $id has not read the scope yet; its Changes job will read the label itself."
              exit 0
            fi
            echo "Cancelling in-flight run $id so the new scope applies."
            gh run cancel "$id"
          fi
          # A cancelled run can take minutes to finish cancelling, and a rerun is refused until it has.
          for i in $(seq 1 40); do
            if gh run rerun "$id"; then echo "Re-ran run $id."; exit 0; fi
            sleep 15
          done
          echo "::error::Run $id never became re-runnable; re-add the fast-ci label once it has completed."
          exit 1
