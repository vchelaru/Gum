name: "Samples"

# This is the regression test for Samples/SilkNetGum, the proof-of-concept that SkiaGum is
# drop-in for a Silk.NET host (#2738), and for every other sample building against the runtimes
# (#3570). It takes ~20 minutes on one Windows runner and does not gate merges, so it runs nightly
# against main. A PR runs it only when it edits a sample or this build; a runtime change that
# breaks a sample shows up the next morning.
on:
  schedule:
    # 03:17 UTC is 9pm in Denver (8pm in winter). Scheduled runs have started up to ~6 hours late,
    # and this keeps a late run out of the morning. Off the hour because the top of the hour is busiest.
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - 'Samples/**'
      - '.github/scripts/build-all.ps1'
      - '.github/workflows/build-samples.yaml'
  workflow_dispatch:

# A new push to a PR cancels the run it supersedes; the nightly and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    Build-Samples:
        runs-on: windows-latest
        steps:
            # See build-and-test.yaml for why we init submodules manually
            # instead of using actions/checkout's `submodules: recursive`.
            - name: Clone Repository
              uses: actions/checkout@v4
              with:
                submodules: false
            - name: Init submodules (non-shallow)
              run: git submodule update --init --recursive

            - name: Setup .NET SDKs
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: 10.0.x

            - name: Install .NET MAUI Workload
              run: dotnet workload install maui

            - name: Build Samples
              run: pwsh ./.github/scripts/build-all.ps1 -Path Samples
