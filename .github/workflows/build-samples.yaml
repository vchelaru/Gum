name: "Samples"

# Push/PR triggers make this the regression test for Samples/SilkNetGum, the
# proof-of-concept that SkiaGum is drop-in for a Silk.NET host (#2738). Without
# them it only ran on manual dispatch and could silently bitrot (#3570).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.gitbook/**']
  pull_request:
    # No branches filter: PRs into integration branches need checks too (#4695).
    # The tool-only paths are skipped: no sample references the tool, its plugins or its tests.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitbook/**'
      - 'Gum/**'
      - 'Tool/**'
      - 'Tools/Gum.Presentation/**'
      - 'DataUi.Core/**'
      - 'AvaloniaDataUi/**'
      - 'Tests/Gum.Avalonia.Tests/**'
      - 'Tests/Gum.Presentation.Tests/**'
      - 'Direction/**'
      - '.claude/**'
  workflow_dispatch:

# A new push to a PR cancels the run it supersedes; main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    Build-Samples:
        runs-on: windows-latest
        steps:
            # See build-and-test.yaml for why we init submodules manually
            # instead of using actions/checkout's `submodules: recursive`.
            - name: Clone Repository
              uses: actions/checkout@v4
              with:
                submodules: false
            - name: Init submodules (non-shallow)
              run: git submodule update --init --recursive

            - name: Setup .NET SDKs
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: 10.0.x

            - name: Install .NET MAUI Workload
              run: dotnet workload install maui

            - name: Build Samples
              run: pwsh ./.github/scripts/build-all.ps1 -Path Samples
