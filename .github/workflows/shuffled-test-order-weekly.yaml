name: Shuffled Test Order Weekly

# Runs Gum.Presentation.Tests and MonoGameGum.Tests several times with test classes in a random
# order, to catch a class that leaks static state (ObjectFinder.Self, StandardElementsManager.Self,
# ...) into a later one (#5820). ShuffledTestCollectionOrderer (Tests/TestOrdering) shuffles by
# GUM_TEST_SHUFFLE_SEED; without it the suites keep xUnit's default order, so PR CI is unaffected.
#
# Each run prints its seed. To replay a failure locally on the same commit:
#   GUM_TEST_SHUFFLE_SEED=<seed> GUM_ALLOW_FULL_TESTS=1 dotnet test <project>
# The run's class order is in the shuffle-order artifact.
#
# Not a required check. A failure only fails the run; nothing files an issue.
on:
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:
    inputs:
      runs:
        description: Shuffled runs per test project
        default: '3'

jobs:
  Shuffled-Order:
    strategy:
      fail-fast: false
      matrix:
        project:
          - Tests/Gum.Presentation.Tests/Gum.Presentation.Tests.csproj
          - MonoGameGum.Tests/MonoGameGum.Tests.csproj
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build "${{ matrix.project }}" --configuration Release --verbosity quiet -p:WarningLevel=0
      - name: Run tests in shuffled class order
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          RUNS: ${{ inputs.runs || '3' }}
        run: |
          name=$(basename "$PROJECT" .csproj)
          mkdir -p TestResults
          echo "### $name" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | Seed | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for run in $(seq 1 "$RUNS"); do
            seed=$(( (RANDOM << 15) | RANDOM ))
            echo "::group::$name run $run, GUM_TEST_SHUFFLE_SEED=$seed"
            if GUM_TEST_SHUFFLE_SEED=$seed GUM_TEST_SHUFFLE_ORDER_FILE="$GITHUB_WORKSPACE/TestResults/$name-seed-$seed-order.txt" \
              dotnet test "$PROJECT" --configuration Release --no-build \
                --logger "trx;LogFileName=$name-seed-$seed.trx" --results-directory TestResults; then
              result=passed
            else
              result=FAILED
              failed=1
            fi
            echo "::endgroup::"
            if [ "$result" = FAILED ]; then
              tests=$(grep -oE 'testName="[^"]+"[^>]*outcome="Failed"' "TestResults/$name-seed-$seed.trx" 2>/dev/null \
                | sed -E 's/testName="([^"]+)".*/\1/' | head -20 | paste -sd ',' - || true)
              echo "::error title=Shuffled order failure::$name failed with GUM_TEST_SHUFFLE_SEED=$seed: ${tests:-see the run log}"
            fi
            echo "| $run | $seed | $result |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $failed
      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Shuffled order (${{ matrix.project }})
          path: "TestResults/*.trx"
          reporter: dotnet-trx
          fail-on-error: true
      - name: Upload shuffle order
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shuffle-order-${{ strategy.job-index }}
          path: TestResults/*-order.txt
          if-no-files-found: ignore
