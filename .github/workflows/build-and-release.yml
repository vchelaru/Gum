name: Build and Release Gum Tool

# When to execute (This means manual trigger only)
on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: 'Type'
        type: choice
        options: [release, prerelease, test]   # test = draft
        default: test
        required: true

permissions:
  contents: write
  pull-requests: write

# Define the jobs to run
jobs:
  # The Avalonia head (Direction/avalonia-migration/phase-110): self-contained preview builds for
  # Windows, macOS and Linux, attached to the same release as the WPF zip until cutover. macOS builds
  # run on a Mac so the SDK signs the app host (Apple Silicon refuses unsigned native code); the
  # bundle is then signed ad hoc. Developer ID signing and notarization need an Apple account and CI
  # secrets that do not exist yet, so the preview is unsigned beyond that.
  publish-avalonia-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: ubuntu-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # These plugins copy themselves into the head's build output (post-build), which
      # dotnet publish does not run; the package step copies that folder in. The list is every
      # plain net10.0 plugin project (coverage-matrix.md section 1); the Forms plugin also stages
      # the Forms themes into the head's Content folder.
      - name: Build the plugins that run in the Avalonia head
        run: |
          dotnet build Gum/ConvertToJsonPlugin/ConvertToJsonPlugin.csproj -c Release
          dotnet build Gum/EventOutputPlugin/EventOutputPlugin.csproj -c Release
          dotnet build Gum/GumFormsPlugin/GumFormsPlugin.csproj -c Release
          dotnet build Gum/ImportFromGumxPlugin/ImportFromGumxPlugin.csproj -c Release
          dotnet build Gum/PerformanceMeasurementPlugin/PerformanceMeasurementPlugin.csproj -c Release
          dotnet build Gum/SvgPlugin/SkiaPlugin.csproj -c Release

      - name: Publish and package
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          version=$(date +%Y.%m.%d)
          out="publish/$rid"
          dotnet publish Tool/Gum.Avalonia/Gum.Avalonia.csproj -c Release -r "$rid" --self-contained true -p:Version="$version" -o "$out"
          mkdir -p "$out/Plugins"
          cp -R Tool/Gum.Avalonia/bin/Release/net10.0/Plugins/. "$out/Plugins/"
          if [ -d Tool/Gum.Avalonia/bin/Release/net10.0/Content ]; then
            mkdir -p "$out/Content"
            cp -R Tool/Gum.Avalonia/bin/Release/net10.0/Content/. "$out/Content/"
          fi
          # gumcli beside the head (SvgExportCommand looks in GumCli/ for gumcli[.exe], else gumcli.dll
          # run through dotnet); framework-dependent, since the head's own runtime is self-contained
          # and the CLI's is not shared, the .dll form is what a self-contained head can run.
          dotnet publish Tools/Gum.Cli/Gum.Cli.csproj -c Release -r "$rid" --self-contained true -p:Version="$version" -o "$out/GumCli"
          mkdir -p dist
          case "$rid" in
            win-*)
              (cd "$out" && zip -qr "../../dist/Gum-Avalonia-preview-$rid.zip" .)
              ;;
            osx-*)
              app="publish/app/Gum.app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp -R "$out/." "$app/Contents/MacOS/"
              sed "s/__VERSION__/$version/g" Tool/Gum.Avalonia/Packaging/macOS/Info.plist > "$app/Contents/Info.plist"
              chmod +x "$app/Contents/MacOS/Gum.Avalonia"
              codesign --force --deep --sign - "$app"
              tar -czf "dist/Gum-Avalonia-preview-$rid.tar.gz" -C publish/app Gum.app
              ;;
            linux-*)
              chmod +x "$out/Gum.Avalonia"
              tar -czf "dist/Gum-Avalonia-preview-$rid.tar.gz" -C "$out" .
              ;;
          esac
          (cd dist && shasum -a 256 Gum-Avalonia-preview-* > "Gum-Avalonia-preview-$rid.sha256")

      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-preview-${{ matrix.rid }}
          path: dist/

  build:
    # Waits for the Avalonia preview packages but still runs if they failed, so a preview problem
    # never blocks the WPF release.
    needs: publish-avalonia-preview
    if: ${{ !cancelled() }}
    # Which OS to run on
    runs-on: windows-latest

    # A list of "named" steps
    steps:

      # Pull down the source code
      #
      # No submodule init: this job only builds GumFull.sln, which contains no
      # FNA projects (the sole remaining submodule). Skipping it saves the
      # multi-minute non-shallow clone the runtime lanes pay for.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # REF is not needed when using workflow_dispatch
          #ref: ${{ github.ref_name }}
          submodules: false
          # Supposedly needed for tags
          fetch-depth: 0

      # Install .net dependency
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Restore NuGet packages once. MonoGameGum/KniGum default to desktop-only
      # (mobile TFMs are opt-in via IncludeIOS/IncludeAndroid), so this runner
      # never needs the mobile workloads installed.
      # Uses GumFull.sln so the CLI is built and copied into the Gum tool output
      - name: Restore
        run: dotnet restore GumFull.sln

      # Update AssemblyInfo.cs version dynamically to current date. The build version lives
      # in an AssemblyMetadata("BuildVersion", ...) attribute rather than
      # AssemblyVersion/AssemblyFileVersion - see the comment in AssemblyInfo.cs for why
      # (a WPF/SDK wpftmp bug that made those attributes uncompilable in this project).
      - name: Update AssemblyInfo.cs version
        shell: pwsh
        run: |
          $version = (Get-Date).ToString('yyyy.MM.dd')
          $currentYear = (Get-Date).Year
          $copyrightLine = "Copyright © FlatRedBall 2017-$currentYear."
          $file = "Gum/Properties/AssemblyInfo.cs"

          Write-Host "Updating version in $file to $version"
          (Get-Content $file) -replace 'AssemblyMetadata\("BuildVersion", ".*"\)', "AssemblyMetadata(`"BuildVersion`", `"$version`")" `
                              -replace 'AssemblyCopyright\(".*"\)', "AssemblyCopyright(`"$copyrightLine`")" |
            Set-Content $file

          Write-Host "Updated AssemblyInfo.cs to version $version"

      # Build GUM TOOL (GumFull.sln includes Gum.Cli, which gets copied into the tool output;
      # plugins use $(SolutionDir) in their post-build events so they must be built via the solution)
      - name: Build Gum Tool
        run: dotnet build GumFull.sln -c Release --no-restore

      # Publish Gum as a framework-dependent single-file bundle.
      # All managed assemblies are bundled into Gum.exe; the .NET runtime is still required.
      # -r win-x64 is required for PublishSingleFile even when not self-contained.
      - name: Publish Gum (single-file)
        run: dotnet publish Gum/Gum.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist/publish

      # Some content files are deposited into bin/Release/Content/ by plugin post-build events.
      # dotnet publish has no knowledge of files placed there outside of project items, so we
      # merge the full build-output Content/ folder into the publish output.
      - name: Copy content to publish output
        shell: pwsh
        run: |
          if (Test-Path "Gum/bin/Release/Content") {
            New-Item -ItemType Directory -Force -Path "dist/publish/Content" | Out-Null
            Copy-Item -Path "Gum/bin/Release/Content/*" -Destination "dist/publish/Content" -Recurse -Force
          }

      # Plugins are built by GumFull.sln and copied to bin/Release/Plugins via their own
      # post-build events (which use $(SolutionDir) and don't run during dotnet publish).
      # Use wildcard source so Copy-Item copies the *contents* into the destination folder
      # rather than nesting the folder inside it (which happens when the destination already exists).
      # dotnet publish creates dist/publish/Plugins/ for Plugins/readme.txt, so -Destination
      # "dist/publish/Plugins" already exists and a non-wildcard copy would produce Plugins/Plugins/.
      - name: Copy plugins to publish output
        shell: pwsh
        run: |
          if (Test-Path "Gum/bin/Release/Plugins") {
            New-Item -ItemType Directory -Force -Path "dist/publish/Plugins" | Out-Null
            Copy-Item -Path "Gum/bin/Release/Plugins/*" -Destination "dist/publish/Plugins" -Recurse -Force
          }

      - name: Copy GumCli to publish output
        shell: pwsh
        run: |
          if (Test-Path "Gum/bin/Release/GumCli") {
            New-Item -ItemType Directory -Force -Path "dist/publish/GumCli" | Out-Null
            Copy-Item -Path "Gum/bin/Release/GumCli/*" -Destination "dist/publish/GumCli" -Recurse -Force
          }

      # 1) Package the publish output
      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/Gum.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist/publish/*" -DestinationPath $zip

      # 1b) Collect the Avalonia preview packages built by publish-avalonia-preview.
      - name: Download Avalonia preview packages
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: avalonia-preview-*
          path: dist/avalonia
          merge-multiple: true

      # 2) Compute tag + title depending on the kind of release
      - name: Compute tag + title
        id: meta
        shell: pwsh
        run: |
          $kind = "${{ github.event.inputs.release_kind }}"
          switch ($kind) {
            'release'    { $prefix='Release';    $prerelease='false'; $draft='false' }
            'prerelease' { $prefix='PreRelease'; $prerelease='true';  $draft='false' }
            'test'       { $prefix='Test';       $prerelease='true';  $draft='true'  }
          }
          $title = "$prefix " + (Get-Date).ToString('MMMM d, yyyy')
          $tag   = "${prefix}_" + (Get-Date).ToString('MMMM_dd_yyyy')
          if ($kind -eq 'test') { $tag = "$tag-$($env:GITHUB_RUN_NUMBER)" }
          "tag=$tag"               >> $env:GITHUB_OUTPUT
          "title=$title"           >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "draft=$draft"           >> $env:GITHUB_OUTPUT

      # 2b) Capture the previous tag BEFORE this run creates its own tag, so the
      # auto-generated release notes diff against the actual prior release. Without this,
      # GitHub picks the comparison base itself, and the <Prefix>_<Month>_DD_YYYY tag scheme
      # uses month *names* (which don't sort chronologically), so its guess can reach far
      # back (e.g. a months-old prerelease turning up as the base for a new prerelease)
      # and dump unrelated PRs into the notes.
      # checkout used fetch-depth: 0, so all tags are present; the new tag does not exist
      # yet at this step.
      #
      # - Full releases summarize everything since the last full release (including work
      #   already shipped in an intermediate prerelease), so the base is restricted to
      #   Release_* tags only.
      # - Prerelease/test builds want the diff since whatever was published most recently,
      #   full release or prerelease, so the base is the newest tag across all of
      #   Release_*/PreRelease_*/Hotfix_* by tagger date.
      - name: Capture previous release tag
        id: prevtag
        shell: pwsh
        run: |
          $kind = "${{ github.event.inputs.release_kind }}"
          $pattern = if ($kind -eq 'release') { 'refs/tags/Release_*' } else { 'refs/tags/Release_*','refs/tags/PreRelease_*','refs/tags/Hotfix_*' }
          $prev = git for-each-ref --sort=-creatordate --format='%(refname:short)' $pattern |
                  Where-Object { $_ -ne "${{ steps.meta.outputs.tag }}" } |
                  Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($prev)) {
            Write-Host "No previous tag found; GitHub will auto-select the comparison base."
          } else {
            Write-Host "Previous tag for notes comparison: $prev"
          }
          "prev_tag=$prev" >> $env:GITHUB_OUTPUT

      # 3) Create PR for version bump. This is peter-evans/create-pull-request's normal,
      # well-supported usage: it discovers the uncommitted AssemblyInfo.cs edit from the
      # "Update AssemblyInfo.cs version" step (which ran earlier, unconditionally), commits
      # it itself, pushes a fresh branch, and opens the PR.
      - name: Create pull request for version bump
        if: github.event.inputs.release_kind == 'release'
        id: version_bump_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: version-bump/${{ steps.meta.outputs.tag }}
          title: "Bump version to ${{ steps.meta.outputs.tag }}"
          body: |
            This PR was automatically created by the Build and Release workflow.

            - Bumps `Gum/Properties/AssemblyInfo.cs` to version **${{ steps.meta.outputs.tag }}**
            - Release title: **${{ steps.meta.outputs.title }}**
          base: main
          labels: |
            automated
            version-bump

      # 3b) Tag the version-bump commit the PR step just created and pushed.
      # Tagging the PR branch's resulting commit (instead of committing to that exact branch
      # name ourselves beforehand) avoids create-pull-request's "branch already matches base"
      # reset: that action expects to be the one doing the committing, and force-resets any
      # branch it's handed that already has a pushed commit identical to what it would have
      # made itself. See the PR description for the full root-cause writeup.
      - name: Create and push release tag
        if: github.event.inputs.release_kind == 'release'
        shell: pwsh
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"

          $headSha = "${{ steps.version_bump_pr.outputs.pull-request-head-sha }}"
          Write-Host "Tagging version-bump commit $headSha"
          git tag -a "${{ steps.meta.outputs.tag }}" -m "${{ steps.meta.outputs.title }}" $headSha

          Write-Host "Pushing tag..."
          git push origin "${{ steps.meta.outputs.tag }}"

      # 4) Create GitHub Release and attach the zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name:     ${{ steps.meta.outputs.title }}
          generate_release_notes: true
          # Pin the comparison base so the auto-notes diff against the actual prior tag
          # (see "Capture previous release tag") instead of GitHub's own guess. Empty only
          # if no prior tag was found, which softprops treats as omitted.
          previous_tag: ${{ steps.prevtag.outputs.prev_tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          draft:      ${{ steps.meta.outputs.draft }}
          files: |
            dist/Gum.zip
            dist/avalonia/*
