name: Build and Release Gum Tool

# When to execute (This means manual trigger only)
on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: 'Type'
        type: choice
        options: [release, prerelease, test]   # test = draft
        default: test
        required: true

permissions:
  contents: write
  pull-requests: write

# Define the jobs to run
jobs:
  # GumPreview's Native AOT variant (issue #4706), used for .gumj projects: starts dramatically
  # faster than the ReadyToRun build below since there is no CoreCLR bootstrap or JIT at all - see
  # Tests/NativeAotSmoke.Harness for the proof that Forms controls survive the trimming this
  # requires. Native AOT can only target the OS it is built on (unlike ReadyToRun, which crossgen2
  # can cross-compile), and publish-avalonia's win-x64 leg below runs on ubuntu-latest for its
  # cross-compiled ReadyToRun build - so the win-x64 AOT build needs its own windows-latest runner,
  # same as the "Native-AOT-Smoke" job in build-and-test.yaml (including the vswhere-on-PATH
  # workaround PublishAot's native link step needs to find the MSVC linker). The other three RIDs
  # already run on their own native OS below, so their AOT build is an extra publish step inline in
  # that job instead of a separate one here.
  publish-gumpreview-aot-win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Add vswhere to PATH (Native AOT link step needs it)
        run: echo "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Publish GumPreview as Native AOT
        shell: bash
        run: |
          set -euo pipefail
          version=$(date +%Y.%m.%d)
          dotnet publish Tool/GumPreview/GumPreview.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:Version="$version" -o publish/Preview-Aot

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: gumpreview-aot-win-x64
          path: publish/Preview-Aot

  # The Avalonia head (Direction/avalonia-migration/phase-110): self-contained builds for Windows,
  # macOS and Linux, the release's packages (the WPF tool no longer ships; Gum.Wpf.sln stays buildable). macOS
  # builds run on a Mac so the SDK signs the app host (Apple Silicon refuses unsigned native code);
  # the bundle is then signed ad hoc. Developer ID signing and notarization need an Apple account and
  # CI secrets that do not exist yet, so the packages are unsigned beyond that.
  publish-avalonia:
    needs: publish-gumpreview-aot-win-x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: ubuntu-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # These plugins copy themselves into the head's build output (post-build), which
      # dotnet publish does not run; the package step copies that folder in. The list is every
      # plain net10.0 plugin project (coverage-matrix.md section 1); the Forms plugin also stages
      # the Forms themes into the head's Content folder.
      - name: Build the plugins that run in the Avalonia head
        run: |
          dotnet build Gum/ConvertToJsonPlugin/ConvertToJsonPlugin.csproj -c Release
          dotnet build Gum/EventOutputPlugin/EventOutputPlugin.csproj -c Release
          dotnet build Gum/GumFormsPlugin/GumFormsPlugin.csproj -c Release
          dotnet build Gum/ImportFromGumxPlugin/ImportFromGumxPlugin.csproj -c Release
          dotnet build Gum/PerformanceMeasurementPlugin/PerformanceMeasurementPlugin.csproj -c Release
          dotnet build Gum/SvgPlugin/SkiaPlugin.csproj -c Release

      # win-x64's Native AOT GumPreview build was published on windows-latest by
      # publish-gumpreview-aot-win-x64 above, since this job's win-x64 leg runs on ubuntu-latest
      # (cross-compiling the ReadyToRun build, which crossgen2 supports but Native AOT does not).
      - name: Download GumPreview Native AOT build (win-x64 only)
        if: matrix.rid == 'win-x64'
        uses: actions/download-artifact@v4
        with:
          name: gumpreview-aot-win-x64
          path: publish/win-x64/Preview-Aot

      - name: Publish and package
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          version=$(date +%Y.%m.%d)
          out="publish/$rid"
          dotnet publish Tool/Gum.Avalonia/Gum.Avalonia.csproj -c Release -r "$rid" --self-contained true -p:Version="$version" -o "$out"
          # GumPreview (issue #4697): the runtime host the tool's Preview button launches. Shipped in
          # a Preview/ folder beside the head so PreviewExecutableLocator's published-layout candidate
          # finds it without resolving from PATH.
          dotnet publish Tool/GumPreview/GumPreview.csproj -c Release -r "$rid" --self-contained true -p:Version="$version" -o "$out/Preview"
          # Native AOT GumPreview variant (issue #4706), used for .gumj projects - additive to the
          # ReadyToRun build above, not a replacement (PreviewExecutableLocator falls back to
          # ReadyToRun if this folder is missing). win-x64's was already published on windows-latest
          # and downloaded into "$out/Preview-Aot" above; the other three RIDs run on their own
          # native OS here, so Native AOT publishing works without a separate runner.
          if [ "$rid" != "win-x64" ]; then
            dotnet publish Tool/GumPreview/GumPreview.csproj -c Release -r "$rid" --self-contained true -p:PublishAot=true -p:Version="$version" -o "$out/Preview-Aot"
          fi
          # Native AOT publishes the binary's debug symbols beside it (GumPreview.pdb on Windows,
          # .dbg on Linux, .dSYM on macOS), 78-86 MB that nothing in the package reads (#4743).
          find "$out/Preview-Aot" \( -name '*.dSYM' -o -name '*.dbg' -o -name '*.pdb' \) -prune -exec rm -rf {} +
          mkdir -p "$out/Plugins"
          cp -R Tool/Gum.Avalonia/bin/Release/net10.0/Plugins/. "$out/Plugins/"
          if [ -d Tool/Gum.Avalonia/bin/Release/net10.0/Content ]; then
            mkdir -p "$out/Content"
            cp -R Tool/Gum.Avalonia/bin/Release/net10.0/Content/. "$out/Content/"
          fi
          # gumcli beside the head, framework-dependent: SvgExportCommand loads GumCli/gumcli.dll
          # in-process through an isolated AssemblyLoadContext (Gum.Services.IsolatedPluginHost)
          # instead of spawning it as a subprocess, so it runs on the head's own already-loaded
          # runtime rather than shipping a second self-contained copy just for SVG export (#4723).
          dotnet publish Tools/Gum.Cli/Gum.Cli.csproj -c Release -r "$rid" --self-contained false -p:Version="$version" -o "$out/GumCli"
          # XML doc files next to assemblies are pure waste in a packaged release - they exist
          # because GenerateDocumentationFile is on for the runtime libraries so they ship as NuGet
          # packages (#4745). Content/ is excluded since its .xml (if any) is Gum project content,
          # not a doc comment sidecar.
          find "$out" -name '*.xml' -not -path '*/Content/*' -delete
          mkdir -p dist
          case "$rid" in
            win-*)
              (cd "$out" && zip -qr "../../dist/Gum-$rid.zip" .)
              ;;
            osx-*)
              app="publish/app/Gum.app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp -R "$out/." "$app/Contents/MacOS/"
              sed "s/__VERSION__/$version/g" Tool/Gum.Avalonia/Packaging/macOS/Info.plist > "$app/Contents/Info.plist"
              cp Tool/Gum.Avalonia/Packaging/macOS/Gum.icns "$app/Contents/Resources/"
              chmod +x "$app/Contents/MacOS/Gum.Avalonia"
              codesign --force --deep --sign - "$app"
              # xz over gzip (#4753): measured ~28-31% smaller than gzip on a representative
              # self-contained publish, for ~5s more CI time than gzip (plain default xz level,
              # not -9e - that only shaved another ~2.5% for 10x the time). macOS Archive Utility
              # opens .tar.xz natively; Linux's tar/xz-utils are standard on any desktop distro.
              tar -cJf "dist/Gum-$rid.tar.xz" -C publish/app Gum.app
              ;;
            linux-*)
              chmod +x "$out/Gum.Avalonia"
              tar -cJf "dist/Gum-$rid.tar.xz" -C "$out" .
              ;;
          esac
          (cd dist && shasum -a 256 Gum-$rid.* > "Gum-$rid.sha256")

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: avalonia-${{ matrix.rid }}
          path: dist/

  build:
    # The Avalonia packages are the release, so a failed one fails the release.
    needs: publish-avalonia
    # Which OS to run on
    runs-on: windows-latest

    # A list of "named" steps
    steps:

      # Pull down the source code (no submodule init: nothing is built here).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # REF is not needed when using workflow_dispatch
          #ref: ${{ github.ref_name }}
          submodules: false
          # Supposedly needed for tags
          fetch-depth: 0

      # Update AssemblyInfo.cs version dynamically to current date. The build version lives
      # in an AssemblyMetadata("BuildVersion", ...) attribute rather than
      # AssemblyVersion/AssemblyFileVersion - see the comment in AssemblyInfo.cs for why
      # (a WPF/SDK wpftmp bug that made those attributes uncompilable in this project).
      - name: Update AssemblyInfo.cs version
        shell: pwsh
        run: |
          $version = (Get-Date).ToString('yyyy.MM.dd')
          $currentYear = (Get-Date).Year
          $copyrightLine = "Copyright © FlatRedBall 2017-$currentYear."
          $file = "Gum/Properties/AssemblyInfo.cs"

          Write-Host "Updating version in $file to $version"
          (Get-Content $file) -replace 'AssemblyMetadata\("BuildVersion", ".*"\)', "AssemblyMetadata(`"BuildVersion`", `"$version`")" `
                              -replace 'AssemblyCopyright\(".*"\)', "AssemblyCopyright(`"$copyrightLine`")" |
            Set-Content $file

          Write-Host "Updated AssemblyInfo.cs to version $version"

      # 1) Collect the Avalonia packages built by publish-avalonia.
      - name: Download Avalonia packages
        uses: actions/download-artifact@v4
        with:
          pattern: avalonia-*
          path: dist/avalonia
          merge-multiple: true

      # 2) Compute tag + title depending on the kind of release
      - name: Compute tag + title
        id: meta
        shell: pwsh
        run: |
          $kind = "${{ github.event.inputs.release_kind }}"
          switch ($kind) {
            'release'    { $prefix='Release';    $prerelease='false'; $draft='false' }
            'prerelease' { $prefix='PreRelease'; $prerelease='true';  $draft='false' }
            'test'       { $prefix='Test';       $prerelease='true';  $draft='true'  }
          }
          $title = "$prefix " + (Get-Date).ToString('MMMM d, yyyy')
          $tag   = "${prefix}_" + (Get-Date).ToString('MMMM_dd_yyyy')
          if ($kind -eq 'test') { $tag = "$tag-$($env:GITHUB_RUN_NUMBER)" }
          "tag=$tag"               >> $env:GITHUB_OUTPUT
          "title=$title"           >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "draft=$draft"           >> $env:GITHUB_OUTPUT

      # 2b) Capture the previous tag BEFORE this run creates its own tag, so the
      # auto-generated release notes diff against the actual prior release. Without this,
      # GitHub picks the comparison base itself, and the <Prefix>_<Month>_DD_YYYY tag scheme
      # uses month *names* (which don't sort chronologically), so its guess can reach far
      # back (e.g. a months-old prerelease turning up as the base for a new prerelease)
      # and dump unrelated PRs into the notes.
      # checkout used fetch-depth: 0, so all tags are present; the new tag does not exist
      # yet at this step.
      #
      # - Full releases summarize everything since the last full release (including work
      #   already shipped in an intermediate prerelease), so the base is restricted to
      #   Release_* tags only.
      # - Prerelease/test builds want the diff since whatever was published most recently,
      #   full release or prerelease, so the base is the newest tag across all of
      #   Release_*/PreRelease_*/Hotfix_* by tagger date.
      - name: Capture previous release tag
        id: prevtag
        shell: pwsh
        run: |
          $kind = "${{ github.event.inputs.release_kind }}"
          $pattern = if ($kind -eq 'release') { 'refs/tags/Release_*' } else { 'refs/tags/Release_*','refs/tags/PreRelease_*','refs/tags/Hotfix_*' }
          $prev = git for-each-ref --sort=-creatordate --format='%(refname:short)' $pattern |
                  Where-Object { $_ -ne "${{ steps.meta.outputs.tag }}" } |
                  Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($prev)) {
            Write-Host "No previous tag found; GitHub will auto-select the comparison base."
          } else {
            Write-Host "Previous tag for notes comparison: $prev"
          }
          "prev_tag=$prev" >> $env:GITHUB_OUTPUT

      # 3) Create PR for version bump. This is peter-evans/create-pull-request's normal,
      # well-supported usage: it discovers the uncommitted AssemblyInfo.cs edit from the
      # "Update AssemblyInfo.cs version" step (which ran earlier, unconditionally), commits
      # it itself, pushes a fresh branch, and opens the PR.
      - name: Create pull request for version bump
        if: github.event.inputs.release_kind == 'release'
        id: version_bump_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: version-bump/${{ steps.meta.outputs.tag }}
          title: "Bump version to ${{ steps.meta.outputs.tag }}"
          body: |
            This PR was automatically created by the Build and Release workflow.

            - Bumps `Gum/Properties/AssemblyInfo.cs` to version **${{ steps.meta.outputs.tag }}**
            - Release title: **${{ steps.meta.outputs.title }}**
          base: main
          labels: |
            automated
            version-bump

      # 3b) Tag the version-bump commit the PR step just created and pushed.
      # Tagging the PR branch's resulting commit (instead of committing to that exact branch
      # name ourselves beforehand) avoids create-pull-request's "branch already matches base"
      # reset: that action expects to be the one doing the committing, and force-resets any
      # branch it's handed that already has a pushed commit identical to what it would have
      # made itself. See the PR description for the full root-cause writeup.
      - name: Create and push release tag
        if: github.event.inputs.release_kind == 'release'
        shell: pwsh
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"

          $headSha = "${{ steps.version_bump_pr.outputs.pull-request-head-sha }}"
          Write-Host "Tagging version-bump commit $headSha"
          git tag -a "${{ steps.meta.outputs.tag }}" -m "${{ steps.meta.outputs.title }}" $headSha

          Write-Host "Pushing tag..."
          git push origin "${{ steps.meta.outputs.tag }}"

      # 4) Create GitHub Release and attach the packages
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name:     ${{ steps.meta.outputs.title }}
          generate_release_notes: true
          # Pin the comparison base so the auto-notes diff against the actual prior tag
          # (see "Capture previous release tag") instead of GitHub's own guess. Empty only
          # if no prior tag was found, which softprops treats as omitted.
          previous_tag: ${{ steps.prevtag.outputs.prev_tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          draft:      ${{ steps.meta.outputs.draft }}
          files: |
            dist/avalonia/*
