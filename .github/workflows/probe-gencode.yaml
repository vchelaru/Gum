name: probe-gencode
on:
  push:
    branches: [6092-gencode-job-faster]
jobs:
  noinstall:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Workload state
        shell: bash
        run: |
          dotnet --version
          dotnet workload list
          dotnet workload --info | head -30
      - name: New pipeline
        shell: pwsh
        run: |
          function T($n, [scriptblock]$b) { $sw=[Diagnostics.Stopwatch]::StartNew(); & $b; Write-Host "TIMING $n $([int]$sw.Elapsed.TotalSeconds)s exit=$LASTEXITCODE" }
          T "cli build" { dotnet build "Tools/Gum.Cli/Gum.Cli.csproj" --configuration Release --verbosity quiet -p:WarningLevel=0 }
          $cli = "Tools/Gum.Cli/bin/Release/net10.0/GumCli.exe"
          $g = @("Tests/CodeGen_Maui_FullCodegen/Content/GumProject/CodeGenTestProject.gumx","Tests/CodeGen_MonoGame_ByReference/Content/GumProject/CodeGenTestProject.gumx","Tests/CodeGen_MonoGameForms_ByReference/Content/GumProject/CodeGenTestProject.gumx","Tests/CodeGen_MonoGameForms_Localization_ByReference/Content/GumProject/LocalizationCodeGenTestProject.gumx","Tests/CodeGen_MonoGameForms_FullCodegen/Content/CodeGenProject.gumx","Tests/CodeGen_Raylib_ByReference/Content/GumProject/CodeGenTestProject.gumx","Tests/CodeGen_Skia_ByReference/Content/GumProject/CodeGenTestProject.gumx")
          T "codegen x7" { foreach ($x in $g) { & $cli codegen $x } }
          T "restore slnx" { dotnet restore Tests/CodeGen_Harnesses.slnx --verbosity quiet -p:MauiWindowsOnly=true }
          T "build slnx" { dotnet build Tests/CodeGen_Harnesses.slnx --configuration Debug --no-restore --verbosity quiet -p:WarningLevel=0 -p:MauiWindowsOnly=true -m }
          T "themes" { pwsh Tools/build-theme-projects.ps1 -Cli $cli }
          git status --porcelain -- "Tests/CodeGen_*"
  skipmanifest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Workload state
        shell: bash
        run: |
          dotnet --version
          dotnet workload list
          dotnet workload --info | head -30
      - name: Install skip-manifest-update
        shell: bash
        run: |
          s=$(date +%s)
          dotnet workload install maui --skip-manifest-update 2>&1 | tail -15
          echo "INSTALL_SECONDS=$(( $(date +%s) - s ))"
          dotnet workload list
      - name: New pipeline
        shell: pwsh
        run: |
          function T($n, [scriptblock]$b) { $sw=[Diagnostics.Stopwatch]::StartNew(); & $b; Write-Host "TIMING $n $([int]$sw.Elapsed.TotalSeconds)s exit=$LASTEXITCODE" }
          T "cli build" { dotnet build "Tools/Gum.Cli/Gum.Cli.csproj" --configuration Release --verbosity quiet -p:WarningLevel=0 }
          $cli = "Tools/Gum.Cli/bin/Release/net10.0/GumCli.exe"
          $g = @("Tests/CodeGen_Maui_FullCodegen/Content/GumProject/CodeGenTestProject.gumx","Tests/CodeGen_MonoGame_ByReference/Content/GumProject/CodeGenTestProject.gumx","Tests/CodeGen_MonoGameForms_ByReference/Content/GumProject/CodeGenTestProject.gumx","Tests/CodeGen_MonoGameForms_Localization_ByReference/Content/GumProject/LocalizationCodeGenTestProject.gumx","Tests/CodeGen_MonoGameForms_FullCodegen/Content/CodeGenProject.gumx","Tests/CodeGen_Raylib_ByReference/Content/GumProject/CodeGenTestProject.gumx","Tests/CodeGen_Skia_ByReference/Content/GumProject/CodeGenTestProject.gumx")
          T "codegen x7" { foreach ($x in $g) { & $cli codegen $x } }
          T "restore slnx" { dotnet restore Tests/CodeGen_Harnesses.slnx --verbosity quiet -p:MauiWindowsOnly=true }
          T "build slnx" { dotnet build Tests/CodeGen_Harnesses.slnx --configuration Debug --no-restore --verbosity quiet -p:WarningLevel=0 -p:MauiWindowsOnly=true -m }
          T "themes" { pwsh Tools/build-theme-projects.ps1 -Cli $cli }
          git status --porcelain -- "Tests/CodeGen_*"
