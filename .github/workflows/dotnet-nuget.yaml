name: Build and Publish Runtime NuGet Packages

on:
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: 'Publish to NuGet.org'
        required: false
        default: false
        type: boolean
      publish_to_github:
        description: 'Publish to GitHub Packages'
        required: false
        default: false
        type: boolean
      version:
        description: |
          Package version to publish.
          Stable release:  2026.4.23.1
          Pre-release:     2026.4.23.1-preview.1
          Leave empty to use the version currently in each .csproj file.
        required: false
        default: ''
        type: string

env:
  DOTNET_VERSIONS: '6.0.x;8.0.x;9.0.x' # Multiple .NET versions
  CONFIGURATION: Release
  SOLUTION_FILE: 'AllLibraries.sln' # Specify which solution to build

jobs:
  build-and-publish:
    runs-on: windows-latest
    
    steps:
    # See build-and-test.yaml for why we init submodules manually
    # instead of using actions/checkout's `submodules: recursive`.
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch full history for version calculation
        submodules: false
    - name: Init submodules (non-shallow)
      run: git submodule update --init --recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          9.0.x

    - name: Install required workloads
      run: |
        dotnet workload install wasm-tools
        dotnet workload install maui
    
    # IncludeAndroid/IncludeIOS force KniGum's net9.0-android TFM and MonoGameGum's
    # net9.0-ios/net9.0-android TFMs to be restored, built, and packed. Both csprojs use
    # opt-in for mobile (see their comments); without these flags the published Gum.KNI /
    # Gum.MonoGame nupkgs would silently drop their mobile TFMs.
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }} -p:IncludeAndroid=true -p:IncludeIOS=true

    - name: Compute version override
      id: ver
      shell: pwsh
      run: |
        $v = '${{ github.event.inputs.version }}'.Trim()
        if ($v -ne '') {
          echo "flag=-p:Version=$v" >> $env:GITHUB_OUTPUT
        } else {
          echo "flag=" >> $env:GITHUB_OUTPUT
        }

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore -p:IncludeAnalyzers=true -p:IncludeAndroid=true -p:IncludeIOS=true ${{ steps.ver.outputs.flag }}

    # Vic says - why run tests? This seems redundant since we already run tests before merging into main
    # - name: Run tests
    #  run: dotnet test ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

    # Pack NuGet packages (Debug build) - includes both .nupkg and .snupkg
    - name: Pack NuGet packages
      run: dotnet pack ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-build --output ./nupkgs --include-symbols --include-source -p:IncludeAnalyzers=true -p:IncludeAndroid=true -p:IncludeIOS=true ${{ steps.ver.outputs.flag }}

    # Build and pack GumCli as a dotnet tool (not in AllLibraries.sln)
    - name: Build GumCli
      run: dotnet build Tools/Gum.Cli/Gum.Cli.csproj --configuration ${{ env.CONFIGURATION }}

    - name: Pack GumCli
      run: dotnet pack Tools/Gum.Cli/Gum.Cli.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output ./nupkgs ${{ steps.ver.outputs.flag }}

    # Upload artifacts for inspection (both .nupkg and .snupkg)
    - name: Upload NuGet packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: |
          ./nupkgs/*.nupkg
          ./nupkgs/*.snupkg
    
    # Publish to NuGet.org (when explicitly requested).
    - name: Publish to NuGet.org
      if: github.event.inputs.publish_to_nuget == 'true'
      shell: pwsh
      run: |
        Get-ChildItem "./nupkgs/*.nupkg" | ForEach-Object {
          Write-Host "Publishing $($_.Name)..."
          dotnet nuget push $_.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        }

    # Publish to GitHub Packages (when explicitly requested).
    - name: Publish to GitHub Packages
      if: github.event.inputs.publish_to_github == 'true'
      shell: pwsh
      run: |
        Get-ChildItem "./nupkgs/*.nupkg" | ForEach-Object {
          Write-Host "Publishing $($_.Name)..."
          dotnet nuget push $_.FullName --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
        }
