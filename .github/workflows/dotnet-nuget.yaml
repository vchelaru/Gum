name: NuGet

on:
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: 'Publish to NuGet.org'
        required: false
        default: false
        type: boolean
      publish_to_github:
        description: 'Publish to GitHub Packages'
        required: false
        default: false
        type: boolean
      publish_unity:
        description: 'Publish the Unity package to the upm branch'
        required: false
        default: false
        type: boolean
      version:
        description: |
          Package version to publish.
          Stable release:  2026.4.23.1
          Pre-release:     2026.4.23.1-preview.1
          Leave empty to use the version currently in each .csproj file.
          The Unity package needs three-part SemVer, so 2026.4.23.1-preview.1 becomes
          2026.4.23-preview.1.1 there. Empty publishes Unity as <today>-preview.<run number>.
        required: false
        default: ''
        type: string

env:
  DOTNET_VERSIONS: '6.0.x;8.0.x;10.0.x' # Multiple .NET versions
  CONFIGURATION: Release
  SOLUTION_FILE: 'AllLibraries.sln' # Specify which solution to build

jobs:
  build-and-publish:
    runs-on: windows-latest
    
    steps:
    # See build-and-test.yaml for why we init submodules manually
    # instead of using actions/checkout's `submodules: recursive`.
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch full history for version calculation
        submodules: false
    - name: Init submodules (non-shallow)
      run: git submodule update --init --recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          10.0.x

    - name: Install required workloads
      run: |
        dotnet workload install wasm-tools
        dotnet workload install maui
    
    # IncludeAndroid/IncludeIOS force KniGum's net9.0-android TFM and MonoGameGum's
    # net9.0-ios/net9.0-android TFMs to be restored, built, and packed. Both csprojs use
    # opt-in for mobile (see their comments); without these flags the published Gum.KNI /
    # Gum.MonoGame nupkgs would silently drop their mobile TFMs.
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }} -p:IncludeAndroid=true -p:IncludeIOS=true

    - name: Compute version override
      id: ver
      shell: pwsh
      run: |
        $v = '${{ github.event.inputs.version }}'.Trim()
        if ($v -ne '') {
          echo "flag=-p:Version=$v" >> $env:GITHUB_OUTPUT
        } else {
          echo "flag=" >> $env:GITHUB_OUTPUT
        }

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore -p:IncludeAnalyzers=true -p:IncludeAndroid=true -p:IncludeIOS=true ${{ steps.ver.outputs.flag }}

    # Vic says - why run tests? This seems redundant since we already run tests before merging into main
    # - name: Run tests
    #  run: dotnet test ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

    # Pack NuGet packages (Debug build) - includes both .nupkg and .snupkg
    - name: Pack NuGet packages
      run: dotnet pack ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-build --output ./nupkgs --include-symbols --include-source -p:IncludeAnalyzers=true -p:IncludeAndroid=true -p:IncludeIOS=true ${{ steps.ver.outputs.flag }}

    # Build and pack GumCli as a dotnet tool (not in AllLibraries.sln).
    # The version flag belongs on the build too, not just the pack: the pack step is --no-build,
    # so without it the assembly keeps the csproj's version and `gumcli` reports a different
    # version than the package it shipped in (#4515).
    - name: Build GumCli
      run: dotnet build Tools/Gum.Cli/Gum.Cli.csproj --configuration ${{ env.CONFIGURATION }} ${{ steps.ver.outputs.flag }}

    - name: Pack GumCli
      run: dotnet pack Tools/Gum.Cli/Gum.Cli.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output ./nupkgs ${{ steps.ver.outputs.flag }}

    # Every package in a wave is built with the same -p:Version, so every packed assembly must carry
    # it too. A project rebuilt without that property (a nested `dotnet build` from a target, say)
    # overwrites the assembly everything else compiled against, and pack is --no-build, so the
    # mismatch ships and consumers get a FileNotFoundException for a version that exists nowhere
    # (#4974). Runs before the publish steps so a bad wave never reaches NuGet.org.
    - name: Verify packed assembly versions
      shell: pwsh
      run: pwsh Tools/verify-package-assembly-versions.ps1 -PackageDirectory ./nupkgs

    # Upload artifacts for inspection (both .nupkg and .snupkg)
    - name: Upload NuGet packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: |
          ./nupkgs/*.nupkg
          ./nupkgs/*.snupkg
    
    # Forked third-party packages Gum's own packages depend on (ThirdParty/README.md). Added after
    # the version check because they keep their own version; --skip-duplicate makes re-publishing a no-op.
    - name: Add vendored third-party packages
      shell: pwsh
      run: Copy-Item ./ThirdParty/nuget-local/*.nupkg ./nupkgs/

    # Publish to NuGet.org (when explicitly requested).
    - name: Publish to NuGet.org
      if: github.event.inputs.publish_to_nuget == 'true'
      shell: pwsh
      run: |
        Get-ChildItem "./nupkgs/*.nupkg" | ForEach-Object {
          Write-Host "Publishing $($_.Name)..."
          dotnet nuget push $_.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        }

    # Publish to GitHub Packages (when explicitly requested).
    - name: Publish to GitHub Packages
      if: github.event.inputs.publish_to_github == 'true'
      shell: pwsh
      run: |
        Get-ChildItem "./nupkgs/*.nupkg" | ForEach-Object {
          Write-Host "Publishing $($_.Name)..."
          dotnet nuget push $_.FullName --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
        }

  # Unity doesn't read NuGet. Its package, binaries included, goes to the upm branch and a
  # upm/v<version> tag, which users install as a git URL (Unity/publish-unity-package.ps1).
  # Windows because the package ships the win-x64 HarfBuzz native.
  publish-unity:
    if: github.event.inputs.publish_unity == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Unity wants three-part SemVer, so the fourth NuGet part moves into the prerelease label:
      # 2026.4.23.1-preview.1 -> 2026.4.23-preview.1.1. A stable 2026.4.23.1 becomes 2026.4.23, so a
      # second stable on one day is skipped (the publish script skips a tag that already exists).
      - name: Compute Unity version
        id: unityver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'.Trim()
          if ($v -match '^(\d+)\.(\d+)\.(\d+)\.(\d+)(?:-(.+))?$') {
            $base = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
            if ($Matches[5]) { $unity = "$base-$($Matches[5]).$($Matches[4])" } else { $unity = $base }
          } else {
            $unity = (Get-Date).ToString('yyyy.M.d') + "-preview.$($env:GITHUB_RUN_NUMBER)"
          }
          Write-Host "Unity package version: $unity"
          "version=$unity" >> $env:GITHUB_OUTPUT

      - name: Build and pack the Unity package
        shell: pwsh
        run: |
          ./Unity/build-unity-package.ps1
          ./Unity/publish-unity-package.ps1 -Version '${{ steps.unityver.outputs.version }}'

      - name: Upload Unity package
        uses: actions/upload-artifact@v4
        with:
          name: unity-package
          path: Unity/.artifacts/*.tgz

      # Skips if upm/v<version> is already on the remote, so rerunning is safe.
      - name: Push to the upm branch
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./Unity/publish-unity-package.ps1 -Version '${{ steps.unityver.outputs.version }}' -Push
