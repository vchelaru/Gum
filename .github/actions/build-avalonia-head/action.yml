name: Build the Avalonia head
description: >
  Sets up .NET, builds Gum.slnx (the Avalonia tool, its plugins and Gum.Avalonia.Tests) in Release,
  and publishes gumcli into the test output. On Linux it also installs Xvfb and Mesa for the device
  and head-process tests. Shared by Build-Avalonia-Head (per PR) and the nightly end-to-end run.
  Check out the repo first.
runs:
  using: composite
  steps:
    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Build Gum (Gum.slnx, the Avalonia tool and its plugins)
      shell: bash
      run: dotnet build Gum.slnx --configuration Release --verbosity quiet -p:WarningLevel=0
    # Export to SVG runs GumCli/gumcli.dll from beside the tool. Gum.Cli is kept out of Gum.slnx, so
    # publish it into the test output the way the release package ships it; FILE-008 skips without it.
    - name: Publish gumcli into the Gum.Avalonia.Tests output
      shell: bash
      run: dotnet publish Tools/Gum.Cli/Gum.Cli.csproj --configuration Release --self-contained false --verbosity quiet -p:WarningLevel=0 -o Tests/Gum.Avalonia.Tests/bin/Release/net10.0/GumCli
    - name: Install Xvfb and Mesa (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q xvfb libgl1-mesa-dri libglu1-mesa libsdl2-2.0-0
